name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.godot'
      - '**.svg'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

jobs:
  android:
    name: Validate and export DEAD SIGNAL
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Godot project
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DEAD-SIGNAL.apk
          test -s build/DEAD-SIGNAL.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DEAD-SIGNAL-Android-APK
          path: build/DEAD-SIGNAL.apk
          if-no-files-found: error
          retention-days: 30
